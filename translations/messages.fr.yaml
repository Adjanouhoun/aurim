  notice:
    title: "Mentions légales"
    publisher: { title: "Éditeur du site", text: "Le site de commerce électronique AURIM est édité par l’entité présentée ci-dessous." }
    host: { title: "Hébergement", text: "Le site est hébergé par %name%, %address%." }
    intellectual: { title: "Propriété intellectuelle", text: "La marque AURIM, les textes, photographies, graphismes et éléments du site sont protégés. Toute reproduction ou utilisation sans autorisation écrite préalable est interdite, sauf exception prévue par la loi." }
    liability: { title: "Responsabilité", text: "AURIM s’efforce de fournir des informations exactes et actualisées. Les conseils présentés ne remplacent pas un avis médical. En cas de réaction ou de doute, cessez l’utilisation et consultez un professionnel de santé." }
    contact: { title: "Contact", text: "Pour toute question concernant le site, écrivez à %email%." }
  terms:
    title: "Conditions générales de vente"
    validation_note: "Ce modèle doit être validé et adapté par un professionnel du droit aux règles applicables en Mauritanie, au Sénégal, au Mali et en Guinée avant l’ouverture commerciale."
    scope: { title: "1. Objet et vendeur", text: "Les présentes conditions encadrent les ventes de produits cosmétiques conclues sur le site entre %company% et tout client consommateur d’un marché desservi." }
    products: { title: "2. Produits", text: "Les caractéristiques essentielles, la contenance et les conseils d’utilisation figurent sur chaque fiche. Les photographies sont présentées avec le plus grand soin mais ne constituent pas un engagement sur de légères variations d’apparence ou d’emballage." }
    prices: { title: "3. Prix", text: "Les prix sont affichés dans la devise du pays sélectionné. Le total applicable, incluant les frais de livraison ou de retrait éventuels, est affiché avant la validation de la commande." }
    order: { title: "4. Commande", text: "Le client vérifie son panier, son pays, ses coordonnées, son mode de réception et son paiement avant validation. La commande est enregistrée sous une référence unique. AURIM peut refuser ou annuler une commande en cas d’anomalie, de stock insuffisant, de fraude présumée ou de paiement non reçu." }
    payment: { title: "5. Paiement", text: "Le paiement Mobile Money est validé manuellement après réception effective des fonds. Le client doit utiliser le numéro payeur indiqué lors de la commande. Le paiement en espèces est disponible uniquement pour les retraits compatibles. Une commande Mobile Money reste en attente jusqu’à validation." }
    delivery: { title: "6. Livraison et retrait", text: "Les options, adresses, coûts et délais estimatifs sont présentés selon le pays choisi. Le client doit fournir des coordonnées exactes et rester joignable. Un retard raisonnable ou une tentative échouée peut conduire à une nouvelle organisation avec le service client." }
    returns: { title: "7. Annulation, retours et remboursements", text: "Pour des raisons d’hygiène, un produit cosmétique ouvert ou descellé ne peut être repris sauf défaut ou non-conformité. Signalez rapidement tout produit endommagé, erroné ou manquant à %email% avec la référence et des photographies. Les droits impératifs du consommateur applicables dans le pays restent pleinement réservés." }
    compliance: { title: "8. Conformité et précautions", text: "Le client doit lire la composition et les conseils d’utilisation, effectuer un test local si nécessaire et ne pas utiliser un produit contenant un ingrédient auquel il est allergique. Les produits ne sont pas destinés à diagnostiquer ou traiter une maladie." }
    liability: { title: "9. Responsabilité", text: "AURIM répond de la bonne exécution de la vente dans les limites prévues par la loi applicable. Sa responsabilité ne peut être engagée pour une mauvaise utilisation, des informations client inexactes ou un événement extérieur irrésistible et imprévisible." }
    disputes: { title: "10. Réclamations et litiges", text: "Toute réclamation doit d’abord être adressée à %email% afin de rechercher une solution amiable. La loi et les juridictions compétentes seront déterminées selon le pays du client et les règles impératives de protection du consommateur." }
  privacy:
    title: "Politique de confidentialité"
    controller: { title: "Responsable du traitement", text: "%company% traite les données de la boutique AURIM. Le contact relatif à la confidentialité est %email%." }
    data: { title: "Données collectées", text: "Nous traitons les informations fournies lors d’une commande ou d’une demande : identité, e-mail, téléphone, adresse, pays, contenu du panier, livraison, référence, statut et numéro payeur Mobile Money. Des données techniques nécessaires à la sécurité peuvent également être enregistrées." }
    purposes: { title: "Finalités et bases", text: "Les données servent à exécuter la commande, réserver le stock, confirmer le paiement, livrer ou remettre les produits, envoyer les notifications, répondre au service client, prévenir la fraude et respecter les obligations comptables et légales." }
    recipients: { title: "Destinataires", text: "L’accès est limité aux équipes AURIM habilitées et, selon les besoins, aux prestataires d’hébergement, de messagerie et de livraison. Seules les informations strictement utiles sont communiquées. AURIM ne vend pas les données personnelles." }
    retention: { title: "Durée de conservation", text: "Les données de commande sont conservées pendant la durée nécessaire à l’exécution, au service après-vente et aux obligations comptables ou fiscales applicables. Les données de panier et de session sont supprimées à l’expiration de la session ou selon les réglages du navigateur." }
    security: { title: "Sécurité", text: "Des mesures techniques et organisationnelles sont mises en œuvre pour limiter l’accès, protéger les comptes administrateurs et préserver la confidentialité des données. Aucun système ne pouvant garantir un risque nul, tout incident significatif sera traité selon les exigences applicables." }
    rights: { title: "Vos droits", text: "Selon la réglementation applicable, vous pouvez demander l’accès, la rectification, l’effacement, la limitation ou l’opposition au traitement de vos données. Écrivez à %email% en précisant votre demande et, si nécessaire, votre référence de commande. Vous pouvez également saisir l’autorité compétente de votre pays." }
    transfers: { title: "Transferts internationaux", text: "Le stock central et certains prestataires peuvent être situés hors du pays du client, notamment aux États-Unis. AURIM veille à limiter les données transférées et à utiliser des garanties adaptées lorsque la réglementation l’exige." }
    changes: { title: "Mises à jour", text: "Cette politique peut évoluer avec les services et les obligations applicables. La date affichée en haut de page permet d’identifier la version en vigueur." }
  cookies:
    title: "Politique des cookies"
    definition: { title: "Qu’est-ce qu’un cookie ?", text: "Un cookie ou stockage équivalent conserve une petite information dans le navigateur pour faire fonctionner le site et mémoriser un choix pendant la navigation." }
    used: { title: "Stockages utilisés par AURIM", text: "La version actuelle utilise uniquement des stockages strictement nécessaires au fonctionnement de la boutique. Ils ne servent pas à créer un profil publicitaire." }
