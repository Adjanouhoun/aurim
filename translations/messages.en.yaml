    phone: "Phone"
    director: "Publication director"
  notice:
    title: "Legal notice"
    publisher: { title: "Website publisher", text: "The AURIM ecommerce website is published by the entity listed below." }
    host: { title: "Hosting", text: "The website is hosted by %name%, %address%." }
    intellectual: { title: "Intellectual property", text: "The AURIM brand, copy, photographs, graphics and website elements are protected. Reproduction or use without prior written permission is prohibited, except where permitted by law." }
    liability: { title: "Liability", text: "AURIM strives to provide accurate, up-to-date information. The advice shown does not replace medical advice. If you experience a reaction or have concerns, stop using the product and consult a healthcare professional." }
    contact: { title: "Contact", text: "For questions about this website, email %email%." }
  terms:
    title: "Terms and conditions of sale"
    validation_note: "This template must be reviewed and adapted by a legal professional to the rules applicable in Mauritania, Senegal, Mali and Guinea before commercial launch."
    scope: { title: "1. Purpose and seller", text: "These terms govern cosmetic product sales made on the website between %company% and consumer customers in a supported market." }
    products: { title: "2. Products", text: "Essential characteristics, size and directions are shown on each product page. Photographs are prepared with great care but do not guarantee against slight variations in appearance or packaging." }
    prices: { title: "3. Prices", text: "Prices are shown in the currency of the selected country. The applicable total, including any delivery or pickup charge, is displayed before the order is confirmed." }
    order: { title: "4. Order", text: "Customers check their cart, country, contact details, delivery and payment before confirming. Each order receives a unique reference. AURIM may reject or cancel an order in case of an anomaly, insufficient stock, suspected fraud or unpaid funds." }
    payment: { title: "5. Payment", text: "Mobile Money payment is approved manually after funds are actually received. The customer must use the payer number entered with the order. Cash is available only for compatible pickups. A Mobile Money order remains pending until approval." }
    delivery: { title: "6. Delivery and pickup", text: "Available options, addresses, costs and estimated times are displayed for the selected country. Customers must provide accurate contact details and remain reachable. A reasonable delay or failed attempt may require new arrangements with customer care." }
    returns: { title: "7. Cancellation, returns and refunds", text: "For hygiene reasons, opened or unsealed cosmetics cannot be returned unless defective or non-compliant. Promptly report any damaged, incorrect or missing product to %email% with the reference and photographs. Mandatory consumer rights in the customer’s country remain fully applicable." }
    compliance: { title: "8. Compliance and precautions", text: "Customers must read the ingredients and directions, perform a patch test where appropriate, and avoid products containing an ingredient to which they are allergic. Products are not intended to diagnose or treat disease." }
    liability: { title: "9. Liability", text: "AURIM is responsible for proper performance of the sale within the limits of applicable law. It is not liable for misuse, inaccurate customer information or an irresistible and unforeseeable external event." }
    disputes: { title: "10. Complaints and disputes", text: "Complaints should first be sent to %email% so an amicable solution can be sought. Applicable law and jurisdiction will be determined according to the customer’s country and mandatory consumer protection rules." }
  privacy:
    title: "Privacy policy"
    controller: { title: "Data controller", text: "%company% processes AURIM shop data. The privacy contact is %email%." }
    data: { title: "Data collected", text: "We process information supplied with an order or request: identity, email, phone, address, country, cart contents, delivery, reference, status and Mobile Money payer number. Technical data needed for security may also be recorded." }
    purposes: { title: "Purposes and legal grounds", text: "Data is used to perform orders, reserve stock, confirm payment, deliver or hand over products, send notifications, provide customer service, prevent fraud and meet accounting and legal obligations." }
    recipients: { title: "Recipients", text: "Access is limited to authorised AURIM teams and, where needed, hosting, email and delivery providers. Only strictly necessary information is shared. AURIM does not sell personal data." }
    retention: { title: "Retention", text: "Order data is retained for as long as needed for performance, after-sales service and applicable accounting or tax obligations. Cart and session data expires with the session or browser settings." }
    security: { title: "Security", text: "Technical and organisational measures are used to restrict access, protect administrator accounts and preserve confidentiality. As no system can guarantee zero risk, any significant incident will be handled under applicable requirements." }
    rights: { title: "Your rights", text: "Depending on applicable law, you may request access, correction, deletion, restriction or objection regarding your data. Email %email% with your request and, where relevant, your order reference. You may also contact the competent authority in your country." }
    transfers: { title: "International transfers", text: "Central stock and some providers may be located outside the customer’s country, including in the United States. AURIM limits transferred data and uses appropriate safeguards where required." }
    changes: { title: "Updates", text: "This policy may change as services and obligations evolve. The date at the top identifies the current version." }
  cookies:
    title: "Cookie policy"
    definition: { title: "What is a cookie?", text: "A cookie or similar storage saves a small piece of information in the browser to operate the website and remember a choice during browsing." }
    used: { title: "Storage used by AURIM", text: "The current version uses only storage that is strictly necessary for the shop to function. It is not used to build advertising profiles." }
    table: { name: "Name", purpose: "Purpose", duration: "Duration" }
    session: "Secure the session and forms"
    cart: "Retain products in the cart"
    market: "Remember the selected country"
    locale: "Remember the selected language"
    session_duration: "Session duration"
    analytics: { title: "Analytics and advertising", text: "No non-essential advertising or analytics cookie is currently installed. If such a tool is added, it will remain disabled until the visitor consents whenever consent is required." }
    control: { title: "Browser controls", text: "You can delete or block cookies in your browser settings. Blocking necessary storage may prevent the cart, country selection, language or secure form validation from working." }
    contact: { title: "Contact", text: "For questions about cookies or privacy, email %email%." }
